plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	mavenCentral()
}

loom {
	accessWidenerPath = file("src/main/resources/gbf.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
	modImplementation "maven.modrinth:sodium:${project.sodium_version}"
	modCompileOnly "maven.modrinth:iris:${project.iris_version}"
	modLocalRuntime "maven.modrinth:iris:${project.iris_version}"

	modImplementation files("libs/mixinlite-0.2.0.jar")
	annotationProcessor files("libs/mixinlite-0.2.0.jar")

	testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}

	// Nest MixinLite (loader-agnostic mixin extension) like NeoForge's jarJar
	from("libs") {
		include "mixinlite-0.2.0.jar"
		into "META-INF/jars"
	}
}

tasks.named('test', Test).configure {
	useJUnitPlatform()
	def testRunDirectory = layout.buildDirectory.dir('test-run')
	workingDir testRunDirectory
	doFirst {
		testRunDirectory.get().asFile.mkdirs()
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
